<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Shopping Cart | TechStore</title>

    <link rel="stylesheet"
        href="style.css">

    <link rel="preconnect"
        href="https://fonts.googleapis.com">

    <link rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">

</head>

<body>

    <!-- Loader -->

    <div id="loader">

        <div class="spinner"></div>

    </div>

    <!-- Header -->

    <header>

        <nav class="navbar">

            <div class="logo">
                TechStore
            </div>

            <div class="hamburger">
                ☰
            </div>

            <ul class="nav-links">

                <li>
                    <a href="index.html">Home</a>
                </li>

                <li>
                    <a href="products.html">Products</a>
                </li>

                <li>
                    <a href="categories.html">Categories</a>
                </li>

                <li>
                    <a href="cart.html">Cart</a>
                </li>

                <li>
                    <a href="contact.html">Contact</a>
                </li>

            </ul>

            <div class="cart">

                🛒 <span id="cartCount">0</span>

            </div>

            <button id="themeBtn">
                🌙
            </button>

        </nav>

    </header>

    <!-- Cart Section -->

    <section class="cart-section">

        <h1>Your Shopping Cart</h1>

        <p>
            Review your selected products before checkout.
        </p>

        <div class="cart-container">

            <!-- Dynamic Cart Items -->

            <div class="cart-items">

                <div id="cartItems">

                </div>

                <p id="emptyCart"
                    style="display:none;
                    font-size:20px;
                    font-weight:600;
                    margin-top:20px;">

                    Your cart is empty.

                </p>

            </div>

            <!-- Order Summary -->

            <div class="order-summary">

                <h2>Order Summary</h2>

                <div class="summary-row">

                    <span>Subtotal</span>

                    <span id="subtotal">
                        ₹0
                    </span>

                </div>

                <div class="summary-row">

                    <span>Shipping</span>

                    <span id="shipping">
                        ₹499
                    </span>

                </div>

                <div class="summary-row">

                    <span>GST (18%)</span>

                    <span id="gst">
                        ₹0
                    </span>

                </div>

                <hr>

                <div class="summary-total">

                    <span>Total</span>

                    <span id="total">
                        ₹0
                    </span>

                </div>

                <button class="checkout-btn">

                    Proceed To Checkout

                </button>

            </div>

        </div>

    </section>

    <!-- Back To Top -->

    <button id="topBtn">

        ↑

    </button>

    <!-- Footer -->

    <footer>

        <p>

            © 2026 TechStore.
            All Rights Reserved.

        </p>

    </footer>

    <script src="script.js"></script>

</body>

</html>
